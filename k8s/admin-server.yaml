apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-server
  namespace: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-server
  template:
    metadata:
      labels:
        app: admin-server
    spec:
      containers:
        - name: admin-server
          image: 972379852441.dkr.ecr.us-east-1.amazonaws.com/petclinic/admin-server:latest
          ports:
            - containerPort: 9090
          env:
            - name: CONFIG_SERVER_URL
              value: "http://config-server:8888"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-server:8761/eureka/"
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
          resources:
            requests: { cpu: "120m", memory: "250Mi" }
            limits: { cpu: "250m", memory: "400Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: admin-server
  namespace: petclinic
spec:
  selector:
    app: admin-server
  ports:
    - port: 9090
      targetPort: 9090
