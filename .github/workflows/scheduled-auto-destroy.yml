name: Scheduled Auto-Destroy (credit safety net)

# Runs automatically every night so you can never forget infra running and
# burning free-tier credits. Also runnable manually any time.
#
# Default: 22:30 UTC daily. Adjust the cron below or disable entirely by
# commenting out the "schedule" trigger if you want the cluster to persist
# longer between sessions.
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: petclinic-tfstate-${{ secrets.AWS_ACCOUNT_ID }}
  TF_LOCK_TABLE: petclinic-tf-lock
  CLUSTER_NAME: petclinic-eks

jobs:
  check-if-anything-exists:
    runs-on: ubuntu-latest
    outputs:
      cluster_exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if the EKS cluster still exists
        id: check
        run: |
          if aws eks describe-cluster --name "$CLUSTER_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  remove-k8s-workloads:
    needs: check-if-anything-exists
    if: needs.check-if-anything-exists.outputs.cluster_exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        continue-on-error: true
        run: aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      - name: Delete namespace (removes LoadBalancer + all workloads)
        continue-on-error: true
        run: kubectl delete namespace petclinic --timeout=120s || true

      - name: Wait for ELB cleanup
        run: sleep 60

  terraform-destroy:
    needs: [check-if-anything-exists, remove-k8s-workloads]
    if: needs.check-if-anything-exists.outputs.cluster_exists == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve

      - name: Notify (workflow summary)
        run: echo "### 🧹 Auto-destroy ran — all PetClinic AWS resources removed to protect free-tier credits." >> $GITHUB_STEP_SUMMARY

  nothing-to-do:
    needs: check-if-anything-exists
    if: needs.check-if-anything-exists.outputs.cluster_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No cluster found - nothing to destroy, no charges accruing." >> $GITHUB_STEP_SUMMARY
