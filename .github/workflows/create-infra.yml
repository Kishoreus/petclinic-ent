name: Create PetClinic Infra

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "create" to confirm you want to provision AWS infra (billable resources)'
        required: true
        default: 'create'

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: petclinic-tfstate-${{ secrets.AWS_ACCOUNT_ID }}   # made unique per-account
  TF_LOCK_TABLE: petclinic-tf-lock
  CLUSTER_NAME: petclinic-eks

jobs:
  bootstrap-backend:
    if: github.event.inputs.confirm == 'create'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create S3 bucket for terraform state (idempotent)
        run: |
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$TF_STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

      - name: Create DynamoDB lock table (idempotent)
        run: |
          if ! aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" 2>/dev/null; then
            aws dynamodb create-table \
              --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
          fi

  terraform-apply:
    needs: bootstrap-backend
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the state backup back to the repo
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_public_key: ${{ secrets.EC2_PUBLIC_KEY }}

      # S3 (with the DynamoDB lock table) stays the SOURCE OF TRUTH state -
      # this is just a timestamped read-only backup copy committed to the
      # repo, in case the S3 bucket is ever lost/deleted.
      - name: Backup state file to repo
        run: |
          terraform state pull > ../../state-backup/terraform.tfstate.backup
          cd ../../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/state-backup/terraform.tfstate.backup
          git diff --cached --quiet && echo "No state changes to commit" && exit 0
          git commit -m "chore: backup terraform state [skip ci] $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

  deploy-app:
    needs: terraform-apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      - name: Deploy PetClinic manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/config-server.yaml
          kubectl apply -f k8s/discovery-server.yaml
          sleep 30
          kubectl apply -f k8s/customers-service.yaml
          kubectl apply -f k8s/vets-service.yaml
          kubectl apply -f k8s/visits-service.yaml
          kubectl apply -f k8s/admin-server.yaml
          kubectl apply -f k8s/api-gateway.yaml

      - name: Wait for rollout
        run: |
          kubectl -n petclinic rollout status deployment/config-server --timeout=180s
          kubectl -n petclinic rollout status deployment/discovery-server --timeout=180s
          kubectl -n petclinic rollout status deployment/api-gateway --timeout=300s

      - name: Show entrypoint URL
        run: kubectl -n petclinic get svc api-gateway
