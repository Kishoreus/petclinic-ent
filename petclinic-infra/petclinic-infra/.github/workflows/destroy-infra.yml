name: Destroy PetClinic Infra

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm you want to tear down ALL infra'
        required: true

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: petclinic-tfstate-${{ secrets.AWS_ACCOUNT_ID }}
  TF_LOCK_TABLE: petclinic-tf-lock
  CLUSTER_NAME: petclinic-eks

jobs:
  remove-k8s-workloads:
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        continue-on-error: true   # cluster may already be gone / never existed
        run: aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      # Critical: delete the LoadBalancer Service first. If Terraform destroys the
      # VPC while an ELB created by Kubernetes still references it, the VPC/subnet
      # deletion will hang or fail because the ELB is an out-of-band AWS resource.
      - name: Delete namespace (removes LoadBalancer + all workloads)
        continue-on-error: true
        run: |
          kubectl delete namespace petclinic --timeout=120s || true

      - name: Wait for ELB cleanup
        run: sleep 60

  terraform-destroy:
    needs: remove-k8s-workloads
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
